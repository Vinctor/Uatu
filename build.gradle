// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        mavenLocal()
        maven { url "https://maven.zhenguanyu.com/content/repositories/releases" }
        maven { url "https://maven.zhenguanyu.com/content/repositories/snapshots" }
//        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
//        maven { url 'https://maven.aliyun.com/repository/public' }
        // maven { url 'https://mirrors.163.com/maven/repository/maven-public' }
        maven { url 'https://repo.huaweicloud.com/repository/maven' }
        maven { url 'https://maven.ghostscript.com/' }
        maven { url 'https://jitpack.io' }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.3'
        classpath 'com.yuanfudao.android:uatu:0.0.9-SNAPSHOT'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven { url "https://maven.zhenguanyu.com/content/repositories/releases" }
        maven { url "https://maven.zhenguanyu.com/content/repositories/snapshots" }
//        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
//        maven { url 'https://maven.aliyun.com/repository/public' }
        // maven { url 'https://mirrors.163.com/maven/repository/maven-public' }
        maven { url 'https://repo.huaweicloud.com/repository/maven' }
        maven { url 'https://maven.ghostscript.com/' }
        maven { url 'https://jitpack.io' }
        google()
    }
}
allprojects {
    tasks.withType(Javadoc) {
        options {
            encoding "UTF-8"
            charSet 'UTF-8'
            links "http://docs.oracle.com/javase/7/docs/api"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
ext {
    compileSdkVersion = 33
    targetSdkVersion = 33
    minSdkVersion = 21
    buildToolsVersion = "34.0.0"
}